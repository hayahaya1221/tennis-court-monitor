name: Tennis monitor validation and recovery

on:
  workflow_dispatch:
  schedule:
    # Daily 03:17 JST; independent of the production availability schedule.
    - cron: '17 18 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/monitor-validation.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/monitor-validation.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: tennis-monitor-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Read-only live smoke test (LINE disabled)
        id: smoke
        continue-on-error: true
        timeout-minutes: 25
        env:
          TARGET_SITES: bunkyo
          STATE_PATH: /tmp/tennis-validation-seen.json
          BETWEEN_DAY_REQUESTS_MS: '1000'
        run: npm run check > /tmp/tennis-smoke.log 2>&1
      - name: Summarize outcome
        if: always()
        run: |
          if [ -f /tmp/tennis-smoke.log ]; then
            grep -E '"(site|status|daysInspected|matching|new|delivered|reason)"' /tmp/tennis-smoke.log | head -30 >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Open or update failure issue (main only)
        if: steps.smoke.outcome == 'failure' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tennis monitor: live smoke test failed"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title=="Tennis monitor: live smoke test failed") | .number' | head -1)
          body="Read-only smoke test failed. Inspect workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. No LINE message was sent by this validation workflow."
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
      - name: Propose bounded calendar-timeout repair
        if: steps.smoke.outcome == 'failure' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only repair this one diagnosed failure. Never rewrite arbitrary code.
          if ! grep -q "waiting for locator('table').first() to be visible" /tmp/tennis-smoke.log; then
            echo "Not a recognized blank-calendar failure; no automatic code change."
            exit 0
          fi
          if ! grep -q "const NAVIGATION_TIMEOUT_MS = 60000;" src/sites.mjs; then
            echo "Timeout already changed; avoid repeated repair."
            exit 0
          fi
          branch="auto-repair/bunkyo-calendar-timeout"
          if gh api "repos/${{ github.repository }}/branches/$branch" >/dev/null 2>&1; then
            echo "Existing repair branch found; avoid duplicate PR."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/sites.mjs')
          s=p.read_text()
          old='const NAVIGATION_TIMEOUT_MS = 60000;'
          assert s.count(old)==1
          p.write_text(s.replace(old,'const NAVIGATION_TIMEOUT_MS = 90000;'))
          PY
          # Validate the proposed repair in this same run. PRs pushed using
          # GITHUB_TOKEN do not reliably trigger subsequent PR workflows.
          npm test
          if ! timeout 1500s env TARGET_SITES=bunkyo STATE_PATH=/tmp/tennis-repair-seen.json BETWEEN_DAY_REQUESTS_MS=1000 npm run check > /tmp/tennis-repair-smoke.log 2>&1; then
            echo "Repair failed live verification; do not publish an unverified PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Known calendar-timeout repair passed live verification." >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/sites.mjs
          git commit -m "Increase calendar navigation timeout after verified blank-calendar failure"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Auto-repair: increase calendar render timeout to 90s" \
            --body "Automatically proposed only after a live validation detected the known blank-calendar timeout. This changes only the navigation wait. PR validation runs automatically; review before merging."
      - name: Fail when live smoke fails
        if: steps.smoke.outcome == 'failure'
        run: exit 1
